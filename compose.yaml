services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.2
    restart: unless-stopped
    env_file: .env
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  setup:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      capture:
        condition: service_started
      beat:
        condition: service_started

  worker:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-worker:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  capture:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-worker:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 64
    command: ["celery", "--app=config", "worker", "--loglevel=INFO", "--queues=thumbnails-quorum", "--concurrency=1", "--without-mingle", "--without-gossip"]
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-beat:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
