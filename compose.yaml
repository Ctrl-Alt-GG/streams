name: ${COMPOSE_PROJECT_NAME:-streams}

x-app: &app
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    restart: unless-stopped
    env_file: .env
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file: .env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh", "/config/init.sh"]
    volumes:
      - ./deploy/minio/init.sh:/config/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  setup:
    <<: *app
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    restart: "no"
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    <<: *app
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE}/streams-worker:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    <<: *app
    image: ghcr.io/${GHCR_NAMESPACE:?set GHCR_NAMESPACE}/streams-beat:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    depends_on:
      setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy