services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    restart: unless-stopped
    env_file: .env
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file: .env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    env_file: .env
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    # Must be a single list item: Compose shell-splits a plain string command
    # into argv, which would hand `sh -c` only the first token.
    command:
      - |
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
        : "$${MINIO_STATIC_ACCESS_KEY:?MINIO_STATIC_ACCESS_KEY is required}"
        : "$${MINIO_STATIC_SECRET_KEY:?MINIO_STATIC_SECRET_KEY is required}"
        : "$${MINIO_STATIC_BUCKET:?MINIO_STATIC_BUCKET is required}"

        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_STATIC_BUCKET}"
        mc admin user add local "$${MINIO_STATIC_ACCESS_KEY}" "$${MINIO_STATIC_SECRET_KEY}"

        cat > /tmp/static-writer-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${MINIO_STATIC_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${MINIO_STATIC_BUCKET}/*"]
            }
          ]
        }
        EOF

        mc admin policy create local streams-static-writer /tmp/static-writer-policy.json
        # Re-attaching an already-attached policy is an error; the smoke test below
        # is what actually proves the grant is in place.
        mc admin policy attach local streams-static-writer --user "$${MINIO_STATIC_ACCESS_KEY}" || true
        mc anonymous set download "local/$${MINIO_STATIC_BUCKET}"

        mc alias set static-writer http://minio:9000 "$${MINIO_STATIC_ACCESS_KEY}" "$${MINIO_STATIC_SECRET_KEY}"
        printf 'ready\n' | mc pipe "static-writer/$${MINIO_STATIC_BUCKET}/.streams-init-check"
        mc stat "static-writer/$${MINIO_STATIC_BUCKET}/.streams-init-check"
        mc rm "static-writer/$${MINIO_STATIC_BUCKET}/.streams-init-check"
    depends_on:
      minio:
        condition: service_healthy

  setup:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-web:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/?format=json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      beat:
        condition: service_started

  worker:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-worker:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    image: ghcr.io/${GHCR_NAMESPACE:-ctrl-alt-gg}/streams-beat:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
