name: Publish images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [web, worker, beat]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}/streams-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.namespace }}/streams-${{ matrix.component }}:latest
