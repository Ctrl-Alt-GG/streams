name: Publish images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: web
            description: "Streams web: network-private Django directory for streams served by an external MediaMTX deployment."
          - component: worker
            description: "Streams Celery worker: processes the status and thumbnail queues for the Ctrl-Alt-GG streams directory."
          - component: beat
            description: "Streams Celery beat: schedules periodic tasks for the Ctrl-Alt-GG streams directory."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.description=${{ matrix.description }}
            manifest:org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}/streams-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.namespace }}/streams-${{ matrix.component }}:latest
      - name: Attest OCI image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.namespace }}/streams-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
