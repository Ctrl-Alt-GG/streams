name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --settings=config.settings.development
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.development
      - run: uv run python manage.py test catalog --settings=config.settings.test
      - name: Check the production security settings
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: ci-only-hGq7vX2mKp9sWd4zRt6yBn8cLf3jUa5eQo1iMw0xVk
          DJANGO_ALLOWED_HOSTS: streams.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://streams.example.com
          DATABASE_URL: "sqlite://:memory:"
          REDIS_URL: redis://localhost:6379/0
      - run: node --test scripts/*.test.cjs
