name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check --settings=config.settings.development
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.development
      - run: uv run python manage.py test catalog --settings=config.settings.test
      - name: Check the production security settings
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: ci-only-hGq7vX2mKp9sWd4zRt6yBn8cLf3jUa5eQo1iMw0xVk
          DJANGO_ALLOWED_HOSTS: streams.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://streams.example.com
          DATABASE_URL: "sqlite://:memory:"
          REDIS_URL: redis://localhost:6379/0
      - run: node --test scripts/*.test.cjs

  integration:
    # Concurrent writes, locks between processes and migrations of existing rows, which SQLite
    # and the in-memory cache of the other tests can't show.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: streams
          POSTGRES_PASSWORD: streams
          POSTGRES_DB: streams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username streams"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://streams:streams@localhost:5432/streams
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run python manage.py test catalog --tag integration --settings=config.settings.integration

  browser:
    # The player in a real browser, with streams the tests encode: video, audio, recovery after a
    # failure and the back/forward cache.
    runs-on: ubuntu-latest
    env:
      STREAMS_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python manage.py test catalog --tag browser --settings=config.settings.test
