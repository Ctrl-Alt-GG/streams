[project]
name = "streams"
version = "0.1.0"
description = "Private MediaMTX stream directory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = [
    "celery>=5.6.3,<5.7",
    "django>=6.0.7,<6.1",
    "django-environ>=0.14,<0.15",
    "django-health-check>=4.4.3,<4.5",
    "django-redis>=7.0,<7.1",
    "django-storages[s3]>=1.14.6,<1.15",
    "django-tailwind-cli>=4.6.2,<4.7",
    "djangorestframework>=3.17.1,<3.18",
    "drf-spectacular>=0.30,<0.31",
    "drf-spectacular-sidecar>=2026.7.1",
    "gunicorn>=26.0.0,<27",
    "httpx[http2]>=0.28.1,<0.29",
    "markdown-it-py>=4.2.0,<5",
    "psycopg[binary]>=3.3.4,<3.4",
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ", "RUF"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"src/*/migrations/*.py" = ["E501", "RUF012"]
