[project]
name = "streams"
version = "0.1.0"
description = "Private MediaMTX stream directory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = [
    "av>=19.0.2",
    "celery>=5.7.0,<5.8",
    "django>=6.1.3,<6.2",
    "django-environ>=0.14,<0.15",
    "django-health-check>=4.11.4,<4.12",
    "django-redis>=7.0,<7.1",
    "django-tailwind-cli>=4.8.2,<4.9",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "drf-spectacular-sidecar>=2026.10.1",
    "gunicorn>=27.0.0,<28",
    "whitenoise>=6.12,<7",
    "httpx[http2]>=0.28.1,<0.29",
    "markdown-it-py>=4.2.0,<5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8,<3.4",
    "pydantic>=2.14.3,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ", "RUF"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"src/*/migrations/*.py" = ["E501", "RUF012"]
