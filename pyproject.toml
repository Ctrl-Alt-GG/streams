[project]
name = "streams"
version = "0.1.0"
description = "Private MediaMTX stream directory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = [
    "celery>=5.6,<5.7",
    "django>=6.0,<6.1",
    "django-environ>=0.14,<0.15",
    "django-health-check>=4.4,<4.5",
    "django-redis>=7.0,<7.1",
    "django-storages[s3]>=1.14,<1.15",
    "django-tailwind-cli>=4.4,<4.5",
    "djangorestframework>=3.17,<3.18",
    "drf-spectacular>=0.30,<0.31",
    "drf-spectacular-sidecar>=2025.9.1",
    "gunicorn>=23.0,<24",
    "httpx[http2]>=0.28,<0.29",
    "markdown-it-py>=4.0,<5",
    "psycopg[binary]>=3.2,<3.4",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "DJ", "RUF"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"src/catalog/migrations/*.py" = ["RUF012"]
