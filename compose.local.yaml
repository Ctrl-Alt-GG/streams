services:
  setup:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    pull_policy: build

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    pull_policy: build

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    pull_policy: build
    extra_hosts:
      - host.docker.internal:host-gateway

  capture:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    pull_policy: build
    extra_hosts:
      - host.docker.internal:host-gateway

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: beat
    pull_policy: build