services:
  setup:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    pull_policy: build

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    pull_policy: build

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    pull_policy: build
    extra_hosts:
      - host.docker.internal:host-gateway

  beat:
    build:
      context: .
      dockerfile: docker/beat.Dockerfile
    pull_policy: build